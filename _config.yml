# O title e o wordmark no topo de toda pagina. Troque pelo nome do seu blog.
title: Testado antes de recomendar
description: Reviews de IA e automação com evidência declarada e data de conferência.
lang: pt-BR
# Site de projeto (github.io/<repo>) precisa de baseurl, senao todo link cai em 404
# e a canonical sai errada. Dominio proprio ou repo <usuario>.github.io: deixe baseurl vazio.
url: https://pedroboy975.github.io
baseurl: /AI-blog-writer
# Sem theme remoto: o layout e o CSS sao daqui (_layouts/default.html + assets/style.css).
defaults:
  - scope: { path: "" }
    values: { layout: default }
exclude: [node_modules, src, tests, runs, verdicts, glossary, package.json, package-lock.json, tsconfig.json, README.md, "posts/*.newsletter.md", "posts/*.roteiro.md"]
