# Glossario versionado. Cresce com o uso: `npm run ai-blog -- glossary add <termo>`.
# Regra: todo termo daqui que aparecer no artigo precisa de explicacao na 1a ocorrencia.

- termo: API
  definicaoCurta: porta de entrada que um programa abre para outro programa conversar com ele
  aliases: [APIs]

- termo: webhook
  definicaoCurta: aviso automatico que um site dispara para outro assim que algo acontece
  aliases: [webhooks]

- termo: token
  definicaoCurta: pedaco de palavra que a inteligencia artificial conta para cobrar e medir texto
  aliases: [tokens]

- termo: agente
  definicaoCurta: inteligencia artificial que decide sozinha os passos ate concluir uma tarefa
  aliases: [agentes, agente de IA]

- termo: prompt
  definicaoCurta: instrucao em texto que voce escreve para a inteligencia artificial
  aliases: [prompts]

- termo: prompt de sistema
  definicaoCurta: instrucao fixa que define o comportamento da inteligencia artificial em toda conversa
  aliases: [system prompt]

- termo: RAG
  definicaoCurta: tecnica em que a inteligencia artificial busca em documentos seus antes de responder
  aliases: []

- termo: MCP
  definicaoCurta: padrao aberto que conecta a inteligencia artificial a ferramentas e dados externos
  aliases: []

- termo: JSON
  definicaoCurta: formato de texto que programas usam para trocar dados organizados
  aliases: []

- termo: endpoint
  definicaoCurta: endereco especifico de uma API onde voce faz um pedido
  aliases: [endpoints]

- termo: payload
  definicaoCurta: conteudo de dados que viaja dentro de um pedido entre dois sistemas
  aliases: []

- termo: no-code
  definicaoCurta: ferramenta que monta automacoes arrastando blocos na tela, sem escrever codigo
  aliases: [nocode, sem codigo]

- termo: self-hosted
  definicaoCurta: quando voce instala e mantem o programa no seu proprio servidor
  aliases: [self-host, auto-hospedado]

- termo: iterador
  definicaoCurta: bloco que pega uma lista e processa item por item, um de cada vez
  aliases: [iterator]

- termo: roteador
  definicaoCurta: bloco que separa a automacao em caminhos diferentes conforme uma condicao
  aliases: [router]

- termo: parse
  definicaoCurta: ler um texto bruto e separar os pedacos uteis dele
  aliases: [parsear, parsing]

- termo: LLM
  definicaoCurta: modelo de linguagem, o motor de texto por tras do ChatGPT e do Claude
  aliases: [LLMs, modelo de linguagem]

- termo: fine-tuning
  definicaoCurta: treinar um modelo pronto com exemplos seus para especializar as respostas
  aliases: []

- termo: contexto
  definicaoCurta: tudo que a inteligencia artificial consegue ler de uma vez antes de responder
  aliases: [janela de contexto]

- termo: alucinacao
  definicaoCurta: quando a inteligencia artificial inventa uma informacao e apresenta como verdade
  aliases: [alucinacoes, alucinar]

- termo: vibecoding
  definicaoCurta: programar descrevendo o que voce quer e deixando a inteligencia artificial escrever o codigo
  aliases: [vibe coding]

- termo: execucao
  definicaoCurta: uma rodada completa da automacao, do gatilho ate o ultimo bloco
  aliases: [execucoes]

- termo: operacao
  definicaoCurta: cada acao individual que um bloco da automacao realiza
  aliases: [operacoes, credito, creditos]

- termo: gatilho
  definicaoCurta: evento que dispara a automacao, como um e-mail novo chegando
  aliases: [gatilhos, trigger]

- termo: bundle
  definicaoCurta: cada item de dados que anda pela automacao, como um e-mail ou uma linha da planilha
  aliases: [bundles]
