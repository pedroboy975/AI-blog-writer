# Glossário versionado. Cresce com o uso: `npm run ai-blog -- glossary add <termo>`.
# Regra: todo termo daqui que aparecer no artigo precisa de explicação na 1a ocorrência.

- termo: API
  definicaoCurta: porta de entrada que um programa abre para outro programa conversar com ele
  aliases: [APIs]

- termo: webhook
  definicaoCurta: aviso automático que um site dispara para outro assim que algo acontece
  aliases: [webhooks]

- termo: token
  definicaoCurta: pedaço de palavra que a inteligência artificial conta para cobrar e medir texto
  aliases: [tokens]

- termo: agente
  definicaoCurta: inteligência artificial que decide sozinha os passos até concluir uma tarefa
  aliases: [agentes, agente de IA]

- termo: prompt
  definicaoCurta: instrução em texto que você escreve para a inteligência artificial
  aliases: [prompts]

- termo: prompt de sistema
  definicaoCurta: instrução fixa que define o comportamento da inteligência artificial em toda conversa
  aliases: [system prompt]

- termo: RAG
  definicaoCurta: técnica em que a inteligência artificial busca em documentos seus antes de responder
  aliases: []

- termo: MCP
  definicaoCurta: padrão aberto que conecta a inteligência artificial a ferramentas e dados externos
  aliases: []

- termo: JSON
  definicaoCurta: formato de texto que programas usam para trocar dados organizados
  aliases: []

- termo: endpoint
  definicaoCurta: endereço específico de uma API onde você faz um pedido
  aliases: [endpoints]

- termo: payload
  definicaoCurta: conteúdo de dados que viaja dentro de um pedido entre dois sistemas
  aliases: []

- termo: no-code
  definicaoCurta: ferramenta que monta automações arrastando blocos na tela, sem escrever código
  aliases: [nocode, sem código, sem codigo]

- termo: self-hosted
  definicaoCurta: quando você instala e mantém o programa no seu próprio servidor
  aliases: [self-host, auto-hospedado]

- termo: iterador
  definicaoCurta: bloco que pega uma lista e processa item por item, um de cada vez
  aliases: [iterator]

- termo: roteador
  definicaoCurta: bloco que separa a automação em caminhos diferentes conforme uma condição
  aliases: [router]

- termo: parse
  definicaoCurta: ler um texto bruto e separar os pedaços úteis dele
  aliases: [parsear, parsing]

- termo: LLM
  definicaoCurta: modelo de linguagem, o motor de texto por trás do ChatGPT e do Claude
  aliases: [LLMs, modelo de linguagem]

- termo: fine-tuning
  definicaoCurta: treinar um modelo pronto com exemplos seus para especializar as respostas
  aliases: []

- termo: contexto
  definicaoCurta: tudo que a inteligência artificial consegue ler de uma vez antes de responder
  aliases: [janela de contexto]

- termo: alucinação
  definicaoCurta: quando a inteligência artificial inventa uma informação e apresenta como verdade
  aliases: [alucinações, alucinar]

- termo: vibecoding
  definicaoCurta: programar descrevendo o que você quer e deixando a inteligência artificial escrever o código
  aliases: [vibe coding]

- termo: execução
  definicaoCurta: uma rodada completa da automação, do gatilho até o último bloco
  aliases: [execuções]

- termo: operação
  definicaoCurta: cada ação individual que um bloco da automação realiza
  aliases: [operações, crédito, créditos]

- termo: gatilho
  definicaoCurta: evento que dispara a automação, como um e-mail novo chegando
  aliases: [gatilhos, trigger]

- termo: bundle
  definicaoCurta: cada item de dados que anda pela automação, como um e-mail ou uma linha da planilha
  aliases: [bundles]
