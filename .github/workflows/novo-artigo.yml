# Estudio: recebe o veredito montado em /estudio.html e devolve um Pull Request.
#
# O controle de acesso e do GitHub, nao meu: so quem tem permissao de escrita
# neste repositorio consegue disparar um workflow_dispatch.
#
# Autenticacao sem chave (Workload Identity Federation): o job pede um JWT ao
# emissor do proprio GitHub, a Anthropic troca por um token de vida curta. Nao
# existe sk-ant-... guardado em lugar nenhum para vazar ou rotacionar.
#
# Aprovar = dar merge no PR. O merge e o que publica na pagina principal.
name: Novo artigo

on:
  workflow_dispatch:
    inputs:
      verdict_yaml:
        description: "Cole o YAML gerado em /estudio.html"
        required: true
        type: string
      tamanho:
        description: "Tamanho do artigo"
        required: true
        default: medio
        type: choice
        options: [curto, medio, longo]

permissions:
  contents: write
  pull-requests: write
  # Sem isto o GitHub nao emite o JWT e a federacao nem comeca.
  id-token: write

concurrency:
  group: novo-artigo
  cancel-in-progress: false

jobs:
  escrever:
    runs-on: ubuntu-latest
    env:
      # IDs de configuracao, nao credenciais: sozinhos nao autenticam nada, porque
      # a prova e o JWT assinado pelo GitHub. Ficam em Settings > Variables.
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Falhar aqui, com estas frases, e melhor que falhar 40 linhas adiante
      # com um 401 opaco: a API responde "Authentication failed" sem dizer qual
      # das checagens reprovou.
      - name: Conferir a federacao
        run: |
          faltando=""
          for v in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID; do
            [ -z "${!v}" ] && faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Faltam variaveis:$faltando. Console da Claude > Settings > Workload identity > Connect workload > GitHub Actions, depois Settings > Secrets and variables > Actions > Variables neste repositorio."
            exit 1
          fi
          # ANTHROPIC_API_KEY tem precedencia sobre federacao no SDK. Se sobrar
          # uma no ambiente, ela vence calada e a federacao nunca e exercitada.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY esta definida e tem precedencia sobre a federacao. Remova o secret para o job usar o token de vida curta."
            exit 1
          fi

      - name: Pedir o JWT ao GitHub
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          echo "sub do token: $(cut -d. -f2 "$ANTHROPIC_IDENTITY_TOKEN_FILE" | base64 -d 2>/dev/null | jq -r .sub)"

      # O JWT do GitHub vale ~5 minutos e um artigo de 6 secoes com retentativa
      # passa disso. O SDK rele o arquivo a cada refresh, entao basta manter o
      # arquivo fresco. Escrevo em .tmp e movo: mv e atomico, ler pela metade nao.
      - name: Renovar o JWT em segundo plano
        run: |
          nohup bash -c 'while true; do
            sleep 120
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          done' > /dev/null 2>&1 &

      # O YAML entra por env, nunca interpolado direto no shell: conteudo de
      # formulario dentro de um script e injecao de comando esperando acontecer.
      - name: Gravar o veredito
        env:
          VERDICT_YAML: ${{ inputs.verdict_yaml }}
        run: |
          mkdir -p verdicts
          printf '%s\n' "$VERDICT_YAML" > verdicts/_intake.yaml
          echo "--- veredito recebido:"
          cat verdicts/_intake.yaml

      # O SDK le as variaveis de federacao do ambiente do job e faz a troca
      # sozinho na primeira chamada. Nenhuma mudanca no codigo: `new Anthropic()`
      # continua sendo `new Anthropic()`.
      - name: Escrever o artigo
        id: escrever
        run: |
          set -o pipefail
          npx tsx src/cli.ts create verdicts/_intake.yaml --links --size "${{ inputs.tamanho }}" 2>&1 | tee relatorio.txt

      - name: Abrir o Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.escrever.outputs.slug }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mv verdicts/_intake.yaml "verdicts/$SLUG.yaml"
          npx tsx src/cli.ts site

          git checkout -B "post/$SLUG"
          git add "posts/$SLUG.md" "verdicts/$SLUG.yaml" index.md qual-ia-usar.md glossario.md
          git commit -m "post: $SLUG"
          git push -f -u origin "post/$SLUG"

          # O relatorio de lint vai no corpo do PR: aprovar sem abrir o log
          # so funciona se o motivo estiver na mesma tela do botao de merge.
          {
            echo "Gerado pelo estudio. Tamanho: **${{ inputs.tamanho }}**."
            echo
            echo "Leia o artigo na aba *Files changed* antes do merge. O merge publica."
            echo
            echo '```'
            sed -n '/Relatorio:/,/^$/p' relatorio.txt || true
            echo '```'
          } > corpo.md

          gh pr create --base main --head "post/$SLUG" \
            --title "post: $SLUG" --body-file corpo.md
